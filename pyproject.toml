[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rateforge"
version = "0.1.0"
description = "Redis-backed sliding window rate limiter for Python applications"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Tanuj Sharma"}
]
dependencies = [
    "redis>=5.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["rateforge"]

[tool.coverage.report]
show_missing = true